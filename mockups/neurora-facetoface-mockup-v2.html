/* Neurora design tokens — hifi-conversation v1 §9.8 */
:root{
  --ink:#0B0B0B; --acid:#E6FF00; --paper:#FFFFFF; --canvas:#F4F4F4;
  --hairline:#E3E3E3; --outline:#A6A6A6; --mono-gray:#5D5D5D;
  --ink-text:#0D0D0D; --on-acid:#0D0D0D; --margin:20px; --r-sheet:24px;
  --display:'M PLUS Rounded 1c','Arial Rounded MT Bold','Hiragino Maru Gothic ProN',sans-serif;
  --cjk:'Noto Sans JP','Hiragino Sans','Noto Sans CJK JP',sans-serif;
  --body:'Noto Sans','Helvetica Neue',system-ui,sans-serif;
  --mono:'Space Mono',ui-monospace,'SF Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{background:#dcdcdc;font-family:var(--body)}

/* ---- runner chrome (not part of the design: state switcher for review) ---- */
#switcher{position:fixed;top:0;left:0;right:0;z-index:99;display:flex;gap:6px;
  flex-wrap:wrap;padding:8px 10px;background:#1a1a1a;font-family:var(--mono);font-size:9px}
#switcher button{background:#2c2c2c;color:#9d9d9d;border:1px solid #444;border-radius:4px;
  padding:3px 8px;font:inherit;cursor:pointer}
#switcher button.active{background:var(--acid);color:#0D0D0D;border-color:var(--acid)}

/* ---- phone frame 390×844 ---- */
#stage{display:flex;justify-content:center;padding:46px 0 40px}
#phone{position:relative;width:390px;height:844px;background:var(--canvas);
  overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.35)}

/* state containers */
.state{position:absolute;inset:0;display:none}
.state.active{display:block}

/* ---- status header: 44pt, paper canvas ---- */
.p-head{position:absolute;top:0;left:0;right:0;height:44px;background:var(--canvas);
  display:flex;align-items:center;padding:0 var(--margin)}
.p-head .swap{width:44px;height:44px;margin-left:-20px;display:flex;align-items:center;justify-content:center}
.p-head .pair{flex:1;text-align:center;font-family:var(--mono);font-size:11px;
  letter-spacing:.085em;text-transform:uppercase;color:var(--ink-text)}
.p-head .pill{height:24px;padding:0 10px;border:1px solid var(--outline);border-radius:12px;
  display:flex;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.085em;
  text-transform:uppercase;color:var(--mono-gray)}

/* ---- partner panel: ink, 46% of region below header (368 of 800) ---- */
.p-partner{position:absolute;top:44px;left:0;right:0;height:368px;background:var(--ink)}
.p-partner .inner{position:absolute;inset:0;padding:var(--margin);padding-bottom:48px;display:flex;
  flex-direction:column;justify-content:flex-end;transform-origin:50% 50%}
.p-partner.rot .inner{transform:rotate(180deg)}
.p-display{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.18;
  color:#fff;overflow-wrap:break-word}
.p-display.cjk{font-family:var(--cjk);font-weight:700}
.p-meta{display:flex;align-items:center;gap:8px;margin-top:14px;font-family:var(--mono);
  font-size:11px;letter-spacing:.085em;text-transform:uppercase;color:var(--acid)}
.p-meta .spk{margin-left:auto;display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.6);
  text-transform:none;letter-spacing:0}
.p-priv{margin-top:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.085em;
  color:var(--mono-gray)}
.p-flipbtn{position:absolute;top:6px;right:14px;width:44px;height:44px;display:flex;
  align-items:center;justify-content:center;color:rgba(255,255,255,.6)}
.p-partner.rot .p-flipbtn{transform:rotate(180deg)}

/* ---- split mic bar: 64pt straddling the seam at y=412 ---- */
.p-micbar{position:absolute;top:380px;left:0;right:0;height:64px;display:flex;z-index:5}
.mic{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  font-family:var(--mono);font-size:11px;letter-spacing:.085em;text-transform:uppercase;
  position:relative}
.mic-t{background:var(--paper);color:var(--ink-text);border:1px solid var(--outline)}
.mic-p{background:var(--ink);color:var(--paper);border:1px solid var(--ink)}
.p-micbar .grip{position:absolute;left:50%;top:50%;width:36px;height:4px;border-radius:2px;
  background:rgba(255,255,255,.28);transform:translate(-50%,-50%);mix-blend-mode:screen;z-index:6}
.mic.live{background:var(--acid);color:var(--on-acid);border-color:var(--acid)}
.mic.idle{opacity:.4}
.flip .mic-p .lbl{transform:rotate(180deg)}
.flip .mic-p .ic{transform:rotate(180deg)}

/* ---- traveler sheet: paper, bottom-anchored ---- */
.p-sheet{position:absolute;top:412px;left:0;right:0;bottom:0;background:var(--paper);
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:44px var(--margin) var(--margin);
  overflow:hidden}
.p-shead{position:absolute;top:0;left:0;right:0;height:40px;display:flex;align-items:center;
  padding:0 var(--margin);gap:14px;color:var(--mono-gray)}
.p-shead .sp{flex:1}
.ic-s{width:20px;height:20px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:14px}

/* ---- turn cards ---- */
.t-card{padding:14px 0}
.t-head{font-family:var(--mono);font-size:10.5px;letter-spacing:.085em;
  text-transform:uppercase;color:var(--mono-gray);margin-bottom:6px}
.t-body{font-family:var(--body);font-size:17px;line-height:1.35;color:var(--ink-text);margin-top:6px}
.t-hr{height:1px;background:var(--hairline);margin:12px 0}
.t-partner{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.25;color:var(--ink-text)}
.t-partner.cjk{font-family:var(--cjk);font-weight:700}
.t-actions{display:flex;gap:26px;margin-top:10px;font-family:var(--mono);font-size:11px;
  letter-spacing:.085em;text-transform:uppercase;color:var(--ink-text)}
.t-actions span{min-height:44px;display:flex;align-items:center;gap:6px}

/* empty state */
.p-empty{padding:130px 6px 0;font-family:var(--body);font-size:17px;line-height:1.35;
  color:var(--mono-gray);text-align:center}

/* listening: sparse waveform ticks (one side at a time) */
.p-ticks{display:flex;align-items:flex-end;gap:5px;height:22px;margin-top:8px}
.p-ticks i{display:block;width:1px;background:rgba(255,255,255,.55)}
.t-card.live .t-body{color:rgba(13,13,13,.6)}
.t-card.live .t-head{color:rgba(93,93,93,.85)}

/* history revealed: partner panel -> summary strip at 78% sheet snap */
.hist .p-partner{height:176px}
.hist .p-micbar{top:188px}
.hist .p-sheet{top:220px;padding-top:44px}
.hist .p-display{font-size:28px;line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.p-section{font-family:var(--mono);font-size:10.5px;letter-spacing:.085em;text-transform:uppercase;
  color:var(--mono-gray);padding:2px 0 8px;display:flex;align-items:center;gap:7px}
.p-section::before{content:'';display:block;width:0;height:0;border:4px solid transparent;
  border-left-color:var(--mono-gray)}

/* scroll continuation cue on expanded sheet */
.hist .p-scrolly{mask-image:linear-gradient(to bottom,#000 86%,transparent 98%);
  -webkit-mask-image:linear-gradient(to bottom,#000 86%,transparent 98%)}

/* show-card: fullscreen ink canvas */
.sc-wrap{position:absolute;inset:0;background:var(--ink);z-index:20;display:flex;
  flex-direction:column;padding:var(--margin)}
.sc-done{align-self:flex-end;min-width:44px;min-height:44px;display:flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:11px;letter-spacing:.085em;
  text-transform:uppercase;color:rgba(255,255,255,.7)}
.sc-line{flex:1;display:flex;align-items:center;font-family:var(--display);font-weight:800;
  font-size:44px;line-height:1.16;color:#fff;overflow-wrap:break-word}
.sc-line.cjk{font-family:var(--cjk);font-weight:700}
.sc-replay{align-self:center;margin-bottom:56px;display:flex;flex-direction:column;align-items:center;
  gap:12px;color:rgba(255,255,255,.85);font-family:var(--mono);font-size:11px;letter-spacing:.085em}
.sc-replay .btn{width:64px;height:64px;border:1px solid rgba(255,255,255,.4);border-radius:32px;
  display:flex;align-items:center;justify-content:center}

/* quick-phrase sheet */
.ph-scrim{position:absolute;inset:0;background:rgba(11,11,11,.32);z-index:14}
.ph-panel{position:absolute;left:0;right:0;top:250px;bottom:0;background:var(--paper);z-index:15;
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:12px var(--margin) var(--margin)}
.ph-grab{width:36px;height:4px;border-radius:2px;background:rgba(11,11,11,.18);margin:0 auto 12px}
.ph-title{font-family:var(--mono);font-size:11px;letter-spacing:.085em;text-transform:uppercase;
  color:var(--ink-text);display:flex;align-items:center;gap:8px}
.ph-title .off{margin-left:auto;color:var(--mono-gray)}
.ph-cats{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.ph-cat{font-family:var(--mono);font-size:10.5px;letter-spacing:.085em;text-transform:uppercase;
  color:var(--mono-gray);border:1px solid var(--outline);border-radius:14px;padding:5px 10px;
  white-space:nowrap}
.ph-cat.on{border-color:var(--ink-text);color:var(--ink-text)}
.ph-item{padding:11px 2px;border-bottom:1px solid var(--hairline)}
.ph-en{font-family:var(--body);font-size:17px;line-height:1.35;color:var(--ink-text)}
.ph-ja{font-family:var(--cjk);font-weight:700;font-size:15px;color:var(--mono-gray);margin-top:2px}

/* missing pack */
.mic.disabled{opacity:.45;cursor:default}
.mic.disabled .sub{position:absolute;bottom:9px;left:0;right:0;text-align:center;
  font-family:var(--mono);font-size:9px;letter-spacing:.085em;color:rgba(255,255,255,.65)}
.pk-card{margin-top:10px;border:1px solid var(--outline);border-radius:16px;padding:16px;background:var(--paper)}
.pk-title{font-family:var(--mono);font-size:11px;letter-spacing:.085em;text-transform:uppercase;color:var(--ink-text)}
.pk-meta{font-family:var(--body);font-size:15px;line-height:1.35;color:var(--ink-text);margin:10px 0 14px}
.pk-row{display:flex;gap:10px}
.pk-btn{min-height:44px;flex:1;display:flex;align-items:center;justify-content:center;border-radius:10px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.085em;text-transform:uppercase}
.pk-btn.pri{background:var(--ink);color:var(--paper)}
.pk-btn.sec{border:1px solid var(--outline);color:var(--ink-text)}

/* first-run coach marks */
.cm-scrim{position:absolute;inset:0;background:rgba(11,11,11,.62);z-index:8}
.coach .p-micbar{z-index:9}
.cm-bubble{position:absolute;left:var(--margin);right:var(--margin);top:252px;z-index:10;
  background:var(--paper);border-radius:16px;padding:18px 18px 14px}
.cm-num{font-family:var(--mono);font-size:10.5px;letter-spacing:.085em;color:var(--mono-gray);
  text-transform:uppercase}
.cm-text{font-family:var(--body);font-size:17px;line-height:1.35;color:var(--ink-text);margin-top:8px}
.cm-foot{display:flex;justify-content:flex-end;margin-top:10px;font-family:var(--mono);
  font-size:10px;letter-spacing:.085em;text-transform:uppercase;color:var(--mono-gray)}
.cm-arrow{position:absolute;left:50%;top:100%;width:0;height:0;border:9px solid transparent;
  border-top-color:var(--paper);transform:translateX(-50%)}
</style>
</head>
<body>
<div id="switcher"></div>
<div id="stage">
  <div id="phone">
    <div class="state active" data-state="ready"></div>
    <div class="state" data-state="listening-traveler"></div>
    <div class="state" data-state="listening-partner-flip"></div>
    <div class="state" data-state="commit"></div>
    <div class="state" data-state="turn-steal"></div>
    <div class="state" data-state="result-tts"></div>
    <div class="state" data-state="history"></div>
    <div class="state" data-state="showcard"></div>
    <div class="state" data-state="phrase-sheet"></div>
    <div class="state" data-state="missing-pack"></div>
    <div class="state" data-state="first-run"></div>
  </div>
</div>
<script>
const I={
 swap:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h12m0 0-3-3m3 3-3 3M20 16H8m0 0 3-3m-3 3 3 3"/></svg>',
 mic:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
 spk:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/></svg>',
 flipIc:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M17 2.5 20.5 6 17 9.5"/><path d="M7 21.5 3.5 18 7 14.5"/><path d="M20 6H9a4 4 0 0 0-4 4M4 18h11a4 4 0 0 0 4-4"/></svg>',
 cam:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><circle cx="12" cy="12" r="3.2"/></svg>',
 ring:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#E3E3E3" stroke-width="2"/><path d="M12 3a9 9 0 0 1 8.2 5.2" stroke="#0D0D0D" stroke-width="2" stroke-linecap="round"/><path d="M10 9.5v5l4.4-2.5z" fill="#0D0D0D"/></svg>',
};
function card(t){return `<article class="t-card">
  <div class="t-head">${t.head}</div>
  <div class="t-body">${t.body}</div>
  ${t.partner?`<div class="t-hr"></div>
  <div class="t-partner ${t.cjk?'cjk':''}">${t.partner}</div>`:''}
  ${t.actions?`<div class="t-actions">${t.actions}</div>`:''}
</article>`;}
function chrome(c){return `
  <header class="p-head">
    <span class="swap">${I.swap}</span>
    <span class="pair">English &#8596; Japanese</span>
    <span class="pill">OFFLINE</span>
  </header>
  <section class="p-partner ${c.flip?'rot':''}">
    <span class="p-flipbtn">${I.flipIc}</span>
    <div class="inner">
      <div class="p-display ${c.cjk?'cjk':''}" ${c.displayStyle?`style="${c.displayStyle}"`:''}>${c.display}</div>
      ${c.ticks?`<div class="p-ticks">${TICKS}</div>`:''}
      <div class="p-meta"><span>Japanese — Offline</span><span class="spk">${I.spk} 84 MB</span></div>
      ${c.privacy?`<div class="p-priv">—— Speech stays on your phone</div>`:''}
    </div>
  </section>
  <div class="p-micbar">
    <div class="mic mic-t ${c.live==='t'?'live':''} ${c.live&&c.live!=='t'?'idle':''}"><span class="ic">${I.mic}</span><span class="lbl">Speak — English</span></div>
    <div class="mic mic-p ${c.partnerDisabled?'disabled':''} ${c.live==='p'?'live':''} ${c.live&&c.live!=='p'?'idle':''}"><span class="ic">${I.mic}</span><span class="lbl">話す — 日本語</span>${c.partnerDisabled?'<span class="sub">Pack needed</span>':''}</div>
    <span class="grip"></span>
  </div>
  <main class="p-sheet">
    <div class="p-shead"><span class="ic-s">T</span><span class="sp"></span><span class="ic-s">${I.cam}</span></div>
    <div class="p-scrolly">${c.sheet}</div>
  </main>${c.overlay||''}`;}

const TICKS='<i style="height:8px"></i><i style="height:16px"></i><i style="height:11px"></i><i style="height:20px"></i><i style="height:6px"></i><i style="height:14px"></i><i style="height:22px"></i><i style="height:9px"></i><i style="height:17px"></i><i style="height:12px"></i><i style="height:5px"></i><i style="height:19px"></i><i style="height:13px"></i><i style="height:7px"></i>';
const STATES={
 ready:{flip:false,privacy:false,display:'<span style="opacity:.4">翻訳はここに表示されます</span>',cjk:true,
  sheet:`<div class="p-empty">Hold a mic. Talk.<br>The screen splits the conversation.</div>`},
 'listening-traveler':{flip:false,privacy:true,live:'t',
  display:'<span style="opacity:.4">翻訳はここに表示されます</span>',cjk:true,ticks:true,
  sheet:`<article class="t-card live">
    <div class="t-head">English — You · listening</div>
    <div class="t-body">Excuse me, which platform does the limited express to Osaka leave from…</div>
  </article>`},
 'listening-partner-flip':{flip:true,privacy:true,live:'p',
  display:'<span style="opacity:.6">すみません、大阪行きの特急は何番線から…</span>',cjk:true,displayStyle:'font-size:28px',ticks:true,
  sheet:`<div class="p-empty" style="padding-top:64px">Partner is speaking…</div>`},
 commit:{flip:false,privacy:false,
  display:'<span style="opacity:.4">翻訳はここに表示されます</span>',cjk:true,
  sheet:`<div style="opacity:.6">${card({head:'English — You · 19:04',body:'Excuse me, which platform does the limited express to Osaka leave from?'})}</div>`},
 'turn-steal':{flip:false,privacy:true,live:'p',ticks:true,
  display:'<span style="opacity:.4">翻訳はここに表示されます</span>',cjk:true,
  sheet:`<div style="opacity:.6">${card({head:'English — You · committing',body:'Excuse me, which platform does the limited express to Osaka leave from?'})}</div>`},
 'result-tts':{flip:false,privacy:false,
  display:'すみません、大阪行きの特急は何番線から出ますか？',cjk:true,
  sheet:card({head:'English — You · 19:04',body:'Excuse me, which platform does the limited express to Osaka leave from?',
   partner:'すみません、大阪行きの特急は何番線から出ますか？',cjk:true,
   actions:`<span>COPY</span><span>${I.ring} PLAY</span><span>KEEP</span>`})},
 history:{flip:false,privacy:false,hist:true,
  display:'すみません、大阪行きの特急は何番線から出ますか？',cjk:true,
  sheet:`<div class="p-section">Recent</div>`
   +card({head:'English — You · 19:04',body:'Excuse me, which platform does the limited express to Osaka leave from?',partner:'すみません、大阪行きの特急は何番線から出ますか？',cjk:true,actions:`<span>COPY</span><span>${I.spk} PLAY</span><span>KEEP</span>`})
   +card({head:'Japanese — Partner · 19:02',body:"It's on platform 4, car 8 is unreserved.",partner:'4番線です。8号車は自由席です。',cjk:true,actions:`<span>COPY</span><span>${I.spk} PLAY</span><span>KEEP</span>`})
   +card({head:'English — You · 18:57',body:'Thank you! And where is the elevator?',partner:'ありがとうございます。エレベーターはどこですか？',cjk:true,actions:`<span>COPY</span><span>${I.spk} PLAY</span><span>KEEP</span>`})},
 showcard:{fullscreen:true,
  html:`<div class="sc-wrap">
    <span class="sc-done">DONE</span>
    <div class="sc-line cjk">すみません、大阪行きの特急は何番線から出ますか？</div>
    <div class="sc-replay"><span class="btn">${I.spk}</span><span>REPLAY</span></div>
  </div>`},
 'phrase-sheet':{flip:false,privacy:false,
  display:'<span style="opacity:.4">翻訳はここに表示されます</span>',cjk:true,
  sheet:`<div class="p-empty">Hold a mic. Talk.<br>The screen splits the conversation.</div>`,
  overlay:`<div class="ph-scrim"></div>
  <div class="ph-panel">
    <div class="ph-grab"></div>
    <div class="ph-title">Quick phrases <span class="off">100% offline</span></div>
    <div class="ph-cats"><span class="ph-cat on">Greetings</span><span class="ph-cat">Prices</span><span class="ph-cat">Directions</span><span class="ph-cat">Allergies</span><span class="ph-cat">Emergency</span></div>
    <div class="ph-item"><div class="ph-en">Hello, nice to meet you.</div><div class="ph-ja">こんにちは。よろしくお願いします。</div></div>
    <div class="ph-item"><div class="ph-en">Thank you very much.</div><div class="ph-ja">ありがとうございます。</div></div>
    <div class="ph-item"><div class="ph-en">Do you speak English?</div><div class="ph-ja">英語を話せますか？</div></div>
    <div class="ph-item"><div class="ph-en">Goodbye — have a nice day.</div><div class="ph-ja">さようなら。良い一日を。</div></div>
  </div>`},
 'missing-pack':{flip:false,privacy:false,partnerDisabled:true,
  display:'ありがとうございます。',cjk:true,
  sheet:card({head:'Saved phrase — You · 19:04',body:'Thank you very much.',partner:'ありがとうございます。',cjk:true,actions:`<span>COPY</span><span>${I.spk} PLAY</span><span>KEEP</span>`})
   +`<div class="pk-card">
      <div class="pk-title">Japanese pack — 210 MB · ~40 s on Wi-Fi</div>
      <div class="pk-meta">Live translation of partner speech needs this pack. Saved phrases keep working offline.</div>
      <div class="pk-row"><span class="pk-btn sec">Schedule download</span><span class="pk-btn pri">Use saved phrases</span></div>
    </div>`},
 'first-run':{flip:false,privacy:false,coach:true,
  display:'<span style="opacity:.4">翻訳はここに表示されます</span>',cjk:true,
  sheet:`<div class="p-empty">Hold a mic. Talk.<br>The screen splits the conversation.</div>`,
  overlay:`<div class="cm-scrim"></div>
  <div class="cm-bubble">
    <div class="cm-num">Tip 1 of 3</div>
    <div class="cm-text">Each of you gets one button. Hold yours and talk — the screen keeps both sides of the conversation.</div>
    <div class="cm-foot">Tap anywhere to continue</div>
    <span class="cm-arrow"></span>
  </div>`},
};

for(const el of document.querySelectorAll('.state')){
  const cfg=STATES[el.dataset.state]||STATES.ready;
  if(cfg.hist)el.classList.add('hist');
  if(cfg.flip)el.classList.add('flip');
  if(cfg.coach)el.classList.add('coach');
  el.innerHTML=cfg.fullscreen?cfg.html:chrome(cfg);
}
const bar=document.getElementById('switcher');
[...document.querySelectorAll('.state')].forEach(s=>{
  const b=document.createElement('button');b.textContent=s.dataset.state;b.dataset.state=s.dataset.state;
  b.onclick=()=>{location.hash=s.dataset.state;};bar.appendChild(b);
});
function applyHash(){
  const h=(location.hash||'#ready').slice(1);
  document.querySelectorAll('.state').forEach(s=>s.classList.toggle('active',s.dataset.state===h));
  document.querySelectorAll('#switcher button').forEach(b=>b.classList.toggle('active',b.dataset.state===h));
}
addEventListener('hashchange',applyHash);applyHash();
</script>
</body>
</html>
