/* Neurora design tokens — hifi-home-solo v1 §9.9 */
:root{
  --ink:#0B0B0B; --acid:#E6FF00; --paper:#FFFFFF; --canvas:#F4F4F4;
  --hairline:#E3E3E3; --outline:#A6A6A6; --mono-gray:#5D5D5D;
  --ink-text:#0D0D0D; --on-acid:#0D0D0D; --margin:20px; --r-sheet:24px;
  --r-pill:999px; --r-chip:8px; --r-ctl:12px; --r-card:16px; --r-circle:50%;
  --display:'M PLUS Rounded 1c','Arial Rounded MT Bold','Hiragino Maru Gothic ProN',sans-serif;
  --cjk:'Noto Sans JP','Hiragino Sans','Noto Sans CJK JP',sans-serif;
  --body:'Noto Sans','Helvetica Neue',system-ui,sans-serif;
  --mono:'Space Mono',ui-monospace,'SF Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{background:#dcdcdc;font-family:var(--body)}

.flag{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;font-size:12px;letter-spacing:0}
.pair .sep{color:var(--mono-gray);font-weight:400}

/* ---- runner chrome (not part of the design: state switcher for review) ---- */
#switcher{position:fixed;top:0;left:0;right:0;z-index:99;display:flex;gap:6px;
  flex-wrap:wrap;padding:8px 10px;background:#1a1a1a;font-family:var(--mono);font-size:9px}
#switcher button{background:#2c2c2c;color:#9d9d9d;border:1px solid #444;border-radius:8px;
  padding:3px 8px;font:inherit;cursor:pointer}
#switcher button.active{background:var(--acid);color:#0D0D0D;border-color:var(--acid)}

/* ---- phone frame 390×844 ---- */
#stage{display:flex;justify-content:center;padding:46px 0 40px}
#phone{position:relative;width:390px;height:844px;background:var(--canvas);
  overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.35)}

/* state containers */
.state{position:absolute;inset:0;display:none}
.state.active{display:block}

/* ---- status header: 44pt, IDENTICAL construction to hifi-conversation §1 ---- */
.p-head{position:absolute;top:0;left:0;right:0;height:44px;background:var(--canvas);
  display:flex;align-items:center;padding:0 var(--margin)}
.p-head .swap{width:44px;height:44px;margin-left:-20px;display:flex;align-items:center;justify-content:center}
.p-head .pairwrap{flex:1;text-align:center}
.p-head .pair{font-family:var(--mono);font-size:11px;
  letter-spacing:.085em;text-transform:uppercase;color:var(--ink-text)}
.p-head .sub{margin-top:0;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.085em;text-transform:uppercase;color:var(--mono-gray)}
.p-head .pill{height:24px;padding:0 12px;border:1px solid var(--outline);border-radius:var(--r-pill);
  display:flex;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.085em;
  text-transform:uppercase;color:var(--mono-gray)}

/* ---- content zone: 44 → 692, paper canvas, margins 20 ---- */
.h-zone{position:absolute;top:44px;left:0;right:0;bottom:152px;padding:24px var(--margin) 0}

/* empty state (§5.1): exchange-teaching copy in the upper third */
.h-empty{padding-top:64px;text-align:center}
.h-empty .lede{font-family:var(--body);font-size:17px;line-height:1.35;color:var(--ink-text)}
.h-empty .priv{margin-top:16px;font-family:var(--mono);font-size:11px;letter-spacing:.085em;
  text-transform:uppercase;color:var(--mono-gray)}

/* ---- RECENT header + filter chips (§4) ---- */
.h-sec{display:flex;align-items:center;height:32px}
.h-sec .lab{font-family:var(--mono);font-size:11px;letter-spacing:.085em;
  text-transform:uppercase;color:var(--mono-gray);display:flex;align-items:center;gap:8px}
.h-sec .filters{margin-left:auto;display:flex;gap:8px}
.h-chip{height:32px;padding:0 12px;display:flex;align-items:center;border:1px solid var(--outline);
  border-radius:var(--r-pill);font-family:var(--mono);font-size:10.5px;letter-spacing:.085em;
  text-transform:uppercase;color:var(--mono-gray)}
.h-chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* ---- paired-phrase cells (§4) ---- */
.h-cell{position:relative;padding:12px 104px 12px 0;border-top:1px solid var(--hairline)}
.h-cell .ts{position:absolute;top:12px;right:0;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.085em;color:var(--mono-gray)}
.h-cell .img-chip{display:inline-block;vertical-align:1px;margin-right:8px;padding:2px 8px;
  border:1px solid var(--outline);border-radius:var(--r-chip);font-family:var(--mono);font-size:9.5px;
  letter-spacing:.085em;text-transform:uppercase;color:var(--mono-gray)}
.h-trav{font-family:var(--body);font-size:15px;line-height:1.35;color:var(--ink-text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-part{margin-top:4px;font-family:var(--display);font-weight:800;font-size:17px;line-height:1.25;
  color:var(--ink-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-part.cjk{font-family:var(--cjk);font-weight:700}
.h-keep{display:inline-block;vertical-align:0px;margin-right:8px;padding:2px 8px;background:var(--ink);
  border-radius:var(--r-chip);font-family:var(--mono);font-size:9.5px;letter-spacing:.085em;
  text-transform:uppercase;color:var(--paper)}

/* in-progress cell (listening, §5.2): body 17pt at 60% ink, no trailing cluster */
.h-cell.live .h-trav{font-size:17px;color:rgba(13,13,13,.6)}
.h-cell.live .ts{color:rgba(93,93,93,.85)}

/* ---- conversation entry pill (§1): outlined, mono caps, h=44, 12 above dock ---- */
.h-f2f{position:absolute;left:var(--margin);right:var(--margin);bottom:96px;height:44px;
  border:1px solid var(--outline);border-radius:var(--r-pill);display:flex;align-items:center;
  justify-content:center;gap:10px;font-family:var(--mono);font-size:11px;
  letter-spacing:.085em;text-transform:uppercase;color:var(--ink-text);background:var(--canvas)}

/* ---- orb dock (§3): flat, 84pt bottom region, one acid primary ---- */
.h-dock{position:absolute;left:0;right:0;bottom:0;height:84px}
.h-orb{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:var(--r-circle);
  transform:translate(-50%,-50%);background:var(--acid);display:flex;align-items:center;
  justify-content:center;color:var(--on-acid)}
.h-orb svg{width:24px;height:24px}
.h-util{position:absolute;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;color:var(--ink-text)}
.h-util .tg{font-family:var(--body);font-size:24px;line-height:1}
.h-util svg{width:24px;height:24px}
.h-util.t{left:calc(50% - 64px)}
.h-util.c{left:calc(50% + 64px)}
.h-util.dim{opacity:.4}

/* capture region: ticks above dock + hint (§3 live behavior) */
.h-ticks{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);display:flex;
  align-items:flex-end;gap:4px;height:24px}
.h-ticks i{display:block;width:1px;background:rgba(11,11,11,.5)}
.h-hint{position:absolute;left:0;right:0;bottom:148px;text-align:center;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.085em;text-transform:uppercase;
  color:var(--ink-text)}

/* ---- show-card: fullscreen ink canvas, shared component with conversation §5.8 ---- */
.sc-wrap{position:absolute;inset:0;background:var(--ink);z-index:20;display:flex;
  flex-direction:column;padding:var(--margin)}
.sc-done{align-self:flex-end;min-width:44px;min-height:44px;display:flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:11px;letter-spacing:.085em;
  text-transform:uppercase;color:rgba(255,255,255,.7)}
.sc-line{flex:1;display:flex;align-items:center;font-family:var(--display);font-weight:800;
  font-size:44px;line-height:1.16;color:#fff;overflow-wrap:break-word}
.sc-line.cjk{font-family:var(--cjk);font-weight:700}
.sc-replay{align-self:center;margin-bottom:56px;display:flex;flex-direction:column;align-items:center;
  gap:12px;color:rgba(255,255,255,.85);font-family:var(--mono);font-size:11px;letter-spacing:.085em}
.sc-replay .btn{width:64px;height:64px;border:1px solid rgba(255,255,255,.4);border-radius:var(--r-circle);
  display:flex;align-items:center;justify-content:center}

/* ---- composer sheet (§6 T): bottom sheet over home, acid focus ring ---- */
.cmp-scrim{position:absolute;inset:0;background:rgba(11,11,11,.32);z-index:14}
.cmp-panel{position:absolute;left:0;right:0;top:520px;bottom:0;background:var(--paper);z-index:15;
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:12px var(--margin) var(--margin)}
.cmp-grab{width:36px;height:4px;border-radius:var(--r-pill);background:rgba(11,11,11,.18);margin:0 auto 12px}
.cmp-title{font-family:var(--mono);font-size:11px;letter-spacing:.085em;text-transform:uppercase;
  color:var(--ink-text);display:flex;align-items:center;gap:8px}
.cmp-title .off{margin-left:auto;color:var(--mono-gray)}
.cmp-field{margin-top:16px;border:2px solid var(--acid);border-radius:var(--r-ctl);padding:12px 16px;
  background:var(--paper)}
.cmp-field .in{font-family:var(--body);font-size:17px;line-height:1.35;color:var(--ink-text)}
.cmp-field .caret{display:inline-block;width:2px;height:20px;background:var(--ink-text);
  vertical-align:-4px;margin-left:1px}
.cmp-hint{margin-top:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.085em;
  text-transform:uppercase;color:var(--mono-gray)}
.cmp-send{margin-top:16px;height:44px;border-radius:var(--r-ctl);background:var(--ink);color:var(--paper);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.085em;text-transform:uppercase}

/* ---- missing pack card (§5.6, component from conversation §5.10) ---- */
.pk-card{margin-top:12px;border:1px solid var(--outline);border-radius:var(--r-card);padding:16px;background:var(--paper)}
.pk-title{font-family:var(--mono);font-size:11px;letter-spacing:.085em;text-transform:uppercase;color:var(--ink-text)}
.pk-meta{font-family:var(--body);font-size:15px;line-height:1.35;color:var(--ink-text);margin:12px 0 16px}
.pk-row{display:flex;gap:12px}
.pk-btn{min-height:44px;flex:1;display:flex;align-items:center;justify-content:center;border-radius:var(--r-ctl);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.085em;text-transform:uppercase}
.pk-btn.pri{background:var(--ink);color:var(--paper)}
.pk-btn.sec{border:1px solid var(--outline);color:var(--ink-text)}

/* ---- first-run coach mark 0 (§5.8, identical in form to conversation §5.12) ---- */
.cm-scrim{position:absolute;inset:0;background:rgba(11,11,11,.62);z-index:8}
.coach .h-dock{z-index:9}
.coach .h-orb{box-shadow:0 0 0 4px var(--canvas)}
.cm-bubble{position:absolute;left:var(--margin);right:var(--margin);bottom:196px;z-index:10;
  background:var(--paper);border-radius:var(--r-card);padding:20px 20px 16px}
.cm-num{font-family:var(--mono);font-size:10.5px;letter-spacing:.085em;color:var(--mono-gray);
  text-transform:uppercase}
.cm-text{font-family:var(--body);font-size:17px;line-height:1.35;color:var(--ink-text);margin-top:8px}
.cm-foot{display:flex;justify-content:flex-end;margin-top:12px;font-family:var(--mono);
  font-size:9.5px;letter-spacing:.085em;text-transform:uppercase;color:var(--mono-gray)}
.cm-arrow{position:absolute;left:50%;top:100%;width:0;height:0;border:10px solid transparent;
  border-top-color:var(--paper);transform:translateX(-50%)}
</style>
</head>
<body>
<div id="switcher"></div>
<div id="stage">
  <div id="phone">
    <div class="state active" data-state="empty"></div>
    <div class="state" data-state="listening"></div>
    <div class="state" data-state="commit"></div>
    <div class="state" data-state="recents"></div>
    <div class="state" data-state="saved"></div>
    <div class="state" data-state="composer"></div>
    <div class="state" data-state="showcard"></div>
    <div class="state" data-state="missing-pack"></div>
    <div class="state" data-state="first-run"></div>
  </div>
</div>
<script>
const I={
 swap:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h12m0 0-3-3m3 3-3 3M20 16H8m0 0 3-3m-3 3 3 3"/></svg>',
 mic:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
 stop:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
 spk:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/></svg>',
 cam:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><circle cx="12" cy="12" r="3.2"/></svg>',
};
</script>
<script>
const TICKS='<i style="height:8px"></i><i style="height:16px"></i><i style="height:12px"></i><i style="height:20px"></i><i style="height:8px"></i><i style="height:16px"></i><i style="height:20px"></i><i style="height:8px"></i><i style="height:16px"></i><i style="height:12px"></i><i style="height:4px"></i><i style="height:20px"></i><i style="height:12px"></i><i style="height:8px"></i>';

function header(c={}){return `
  <header class="p-head">
    <span class="swap">${I.swap}</span>
    <span class="pairwrap"><div class="pair"><span class="flag">🇬🇧</span>EN<span class="sep">⇄</span>JA<span class="flag">🇯🇵</span></div>${c.sub?`<div class="sub">${c.sub}</div>`:''}</span>
    <span class="pill">OFFLINE</span>
  </header>`;}

function cell(c){return `<article class="h-cell ${c.live?'live':''}">
  <span class="ts">${c.keep?'<span class="h-keep">KEEP</span>':''}${c.image?`<span class="img-chip">IMAGE</span>`:''}${c.ts}</span>
  <div class="h-trav">${c.trav}</div>
  ${c.part?`<div class="h-part ${c.cjk?'cjk':''}">${c.part}</div>`:''}
</article>`;}

function dock(c={}){return `
  <div class="h-dock">
    ${c.dockExtra||''}
    <span class="h-util t ${c.dim?'dim':''}"><span class="tg">T</span></span>
    <span class="h-orb">${c.live?I.stop:I.mic}</span>
    <span class="h-util c ${c.dim?'dim':''}">${I.cam}</span>
  </div>`;}

function chrome2(c={}){return `
  ${header(c.header)}
  <main class="h-zone">${c.zone||''}</main>
  ${c.hint?`<div class="h-hint">${c.hint}</div>`:''}
  ${c.noF2F?'':`<div class="h-f2f">${I.mic.replace('width="16" height="16"','width="14" height="14"')} FACE TO FACE</div>`}
  ${c.ticks?`<div class="h-ticks">${TICKS}</div>`:''}
  ${dock(c.dock)}
  ${c.overlay||''}`;}

const RECENT_HEAD='<div class="h-sec"><span class="lab">Recent</span><span class="filters"><span class="h-chip">Saved</span></span></div>';
const SAVED_HEAD='<div class="h-sec"><span class="lab">Recent</span><span class="filters"><span class="h-chip on">Saved</span></span></div>';

const CELLS_ALL =
  cell({ts:'19:04',trav:'Excuse me, which platform does the limited express to Osaka leave from?',
        part:'すみません、大阪行きの特急は何番線から出ますか？',cjk:true,trail:true})
 +cell({ts:'19:02',trav:'It’s on platform 4, car 8 is unreserved.',part:'4番線です。8号車は自由席です。',
        cjk:true,trail:true,keep:true})
 +cell({ts:'18:51',image:true,trav:'Menu: grilled eel set — ¥2,400',part:'うなぎの蒲焼き定食 — 2,400円',
        cjk:true,trail:true})
 +cell({ts:'18:40',trav:'Thank you very much.',part:'ありがとうございます。',cjk:true,trail:true,keep:true});

const CELLS_SAVED =
  cell({ts:'19:02',trav:'It’s on platform 4, car 8 is unreserved.',part:'4番線です。8号車は自由席です。',
        cjk:true,trail:true,keep:true})
 +cell({ts:'18:40',trav:'Thank you very much.',part:'ありがとうございます。',cjk:true,trail:true,keep:true});

const STATES={
 empty:{zone:`<div class="h-empty">
   <div class="lede">Hold the button. Talk.<br>It translates — no signal needed.</div>
   <div class="priv">Speech stays on your phone</div>
 </div>`},
 listening:{hint:'Finish speaking first',ticks:true,noF2F:true,dock:{live:true,dim:true},zone:
   cell({ts:'now · listening',trav:'Excuse me, which platform does the limited express…',live:true})
   +`<div style="height:18px"></div>`+RECENT_HEAD+CELLS_ALL},
 commit:{zone:RECENT_HEAD+`<div style="opacity:.6">`
   +cell({ts:'19:04',trav:'Excuse me, which platform does the limited express to Osaka leave from?'})
   +`</div>`
   +cell({ts:'19:02',trav:'It’s on platform 4, car 8 is unreserved.',part:'4番線です。8号車は自由席です。',cjk:true,trail:true,keep:true})
   +cell({ts:'18:51',image:true,trav:'Menu: grilled eel set — ¥2,400',part:'うなぎの蒲焼き定食 — 2,400円',cjk:true,trail:true})},
 recents:{zone:RECENT_HEAD+CELLS_ALL},
 saved:{zone:SAVED_HEAD+CELLS_SAVED},
 composer:{zone:RECENT_HEAD+CELLS_ALL,overlay:`
   <div class="cmp-scrim"></div>
   <div class="cmp-panel">
     <div class="cmp-grab"></div>
     <div class="cmp-title">Text — English <span class="off">100% offline</span></div>
     <div class="cmp-field"><span class="in">Where is the nearest subway entr<span class="caret"></span></span></div>
     <div class="cmp-hint">Same offline path as voice</div>
     <div class="cmp-send">Translate</div>
   </div>`},
 showcard:{fullscreen:true,html:`<div class="sc-wrap">
     <span class="sc-done">DONE</span>
     <div class="sc-line cjk">すみません、大阪行きの特急は何番線から出ますか？</div>
     <div class="sc-replay"><span class="btn">${I.spk}</span><span>REPLAY</span></div>
   </div>`},
 'missing-pack':{header:{sub:'Japanese · Pack needed'},zone:
   `<div class="pk-card">
     <div class="pk-title">Japanese pack — 210 MB · ~40 s on Wi-Fi</div>
     <div class="pk-meta">Voice translation needs this pack. Saved phrases and typed text keep working offline.</div>
     <div class="pk-row"><span class="pk-btn sec">Schedule download</span><span class="pk-btn pri">Use saved phrases</span></div>
   </div>`
   +`<div style="height:18px"></div>`+RECENT_HEAD+CELLS_SAVED},
 'first-run':{zone:`<div class="h-empty">
     <div class="lede">Hold the button. Talk.<br>It translates — no signal needed.</div>
     <div class="priv">Speech stays on your phone</div>
   </div>`,
   coach:true,overlay:`<div class="cm-scrim"></div>
   <div class="cm-bubble">
     <div class="cm-num">Tip 0 — before your first exchange</div>
     <div class="cm-text">Each of you gets one button — this one’s yours. Hold it and talk.</div>
     <div class="cm-foot">Dismisses on first capture</div>
     <span class="cm-arrow"></span>
   </div>`},
};

for(const el of document.querySelectorAll('.state')){
  const cfg=STATES[el.dataset.state]||STATES.empty;
  if(cfg.coach)el.classList.add('coach');
  el.innerHTML=cfg.fullscreen?cfg.html:chrome2(cfg);
}
const bar=document.getElementById('switcher');
[...document.querySelectorAll('.state')].forEach(s=>{
  const b=document.createElement('button');b.textContent=s.dataset.state;b.dataset.state=s.dataset.state;
  b.onclick=()=>{location.hash=s.dataset.state;};bar.appendChild(b);
});
function applyHash(){
  const h=(location.hash||'#empty').slice(1);
  document.querySelectorAll('.state').forEach(s=>s.classList.toggle('active',s.dataset.state===h));
  document.querySelectorAll('#switcher button').forEach(b=>b.classList.toggle('active',b.dataset.state===h));
}
addEventListener('hashchange',applyHash);applyHash();
</script>
</body>
</html>
