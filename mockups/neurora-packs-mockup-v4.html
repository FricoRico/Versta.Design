  --ink:#0B0B0B; --acid:#E6FF00; --paper:#FFFFFF; --canvas:#F4F4F4;
  --hairline:#E3E3E3; --outline:#A6A6A6; --mono-gray:#5D5D5D;
  --ink-text:#0D0D0D; --on-acid:#0D0D0D; --margin:20px; --r-sheet:24px;
  --r-pill:999px; --r-chip:8px; --r-ctl:12px; --r-card:16px; --r-circle:50%;
  --display:'M PLUS Rounded 1c','Arial Rounded MT Bold','Hiragino Maru Gothic ProN',sans-serif;
  --cjk:'Noto Sans JP','Hiragino Sans','Noto Sans CJK JP',sans-serif;
  --body:'Noto Sans','Helvetica Neue',system-ui,sans-serif;
  --mono:'Space Mono',ui-monospace,'SF Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{background:#dcdcdc;font-family:var(--body)}

.flag{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;font-size:12px;letter-spacing:0}
.pair .sep{color:var(--mono-gray);font-weight:400}
.cap .flag{font-size:12px}

/* ---- runner chrome (not part of the design: state switcher for review) ---- */
#switcher{position:fixed;top:0;left:0;right:0;z-index:99;display:flex;gap:6px;
  flex-wrap:wrap;padding:8px 10px;background:#1a1a1a;font-family:var(--mono);font-size:9px}
#switcher button{background:#2c2c2c;color:#9d9d9d;border:1px solid #444;border-radius:8px;
  padding:3px 8px;font:inherit;cursor:pointer}
#switcher button.active{background:var(--acid);color:#0D0D0D;border-color:var(--acid)}

/* ---- phone frame 390×844 ---- */
#stage{display:flex;justify-content:center;padding:110px 0 40px}
#phone{position:relative;width:390px;height:844px;background:var(--canvas);
  overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.35)}

/* state containers */
.state{position:absolute;inset:0;display:none}
.state.active{display:block}

/* ---- host header: 44pt, IDENTICAL construction to hifi-home-solo / hifi-conversation §1 ---- */
.p-head{position:absolute;top:0;left:0;right:0;height:44px;background:var(--canvas);
  display:flex;align-items:center;padding:0 var(--margin);z-index:30}
.p-head .swap{width:44px;height:44px;margin-left:-20px;display:flex;align-items:center;justify-content:center}
.p-head .pairwrap{flex:1;text-align:center}
.p-head .pair{font-family:var(--mono);font-size:11px;
  letter-spacing:.085em;text-transform:uppercase;color:var(--ink-text)}
.p-head .sub{margin-top:0;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.085em;text-transform:uppercase;color:var(--mono-gray)}
.p-head .pill{height:24px;padding:0 12px;border:1px solid var(--outline);border-radius:var(--r-pill);
  display:flex;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.085em;
  text-transform:uppercase;color:var(--mono-gray)}

/* ---- host home surface (backdrop, dimmed by scrim) ---- */
.host{position:absolute;top:44px;left:0;right:0;bottom:0;padding:24px var(--margin) 0}
.scrim{position:absolute;inset:0;background:rgba(11,11,11,.32);z-index:10}

/* ---- pack sheet (spec §1): pinned below header y=44, r=24 top corners ---- */
.psheet{position:absolute;top:44px;left:0;right:0;bottom:0;background:var(--paper);
border-radius:var(--r-sheet) var(--r-sheet) 0 0;z-index:15;display:flex;flex-direction:column}
.ps-grabzone{height:28px;display:flex;align-items:center;justify-content:center;flex:none}
.ps-grabber{width:36px;height:4px;border-radius:var(--r-pill);background:rgba(11,11,11,.2)}
.ps-head{height:44px;display:flex;align-items:center;padding:0 var(--margin);flex:none}
.ps-title{font-family:var(--mono);font-size:11px;letter-spacing:.085em;text-transform:uppercase;
  color:var(--ink-text)}
.ps-done{margin-left:auto;min-width:44px;height:44px;display:flex;
  align-items:center;justify-content:flex-end;font-family:var(--mono);font-size:11px;
  letter-spacing:.085em;text-transform:uppercase;color:var(--ink-text)}
.ps-agg{padding:0 var(--margin) 12px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.085em;text-transform:uppercase;color:var(--mono-gray);flex:none}
.rdot{display:inline-block;width:6px;height:6px;border-radius:var(--r-circle);background:var(--acid);
  margin-right:8px;vertical-align:1px}
.ps-list{flex:1;overflow-y:auto;padding:0 var(--margin)}

/* ---- pack row (spec §3): h=72, hairline top ---- */
.prow{position:relative;height:72px;border-top:1px solid var(--hairline);
  display:flex;align-items:center}
.prow .l{min-width:0}
.prow .native{font-family:var(--body);font-size:17px;line-height:1.35;color:var(--ink-text)}
.prow .native.cjk{font-family:var(--cjk);font-weight:700}
.prow .cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.085em;
  text-transform:uppercase;color:var(--mono-gray);margin-top:1px}
.prow .r{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;
  justify-content:center;min-height:44px;text-align:right}
.prow .r .m{font-family:var(--mono);font-size:10.5px;letter-spacing:.085em;
  text-transform:uppercase;color:var(--ink-text);white-space:nowrap}
.prow .r .m.gray{color:var(--mono-gray)}
.prow .getbtn{height:32px;padding:0 12px;border:1px solid var(--ink);border-radius:var(--r-pill);
  display:inline-flex;align-items:center;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.085em;text-transform:uppercase;color:var(--paper);background:var(--ink)}
.prow .getnow{font-family:var(--mono);font-size:9.5px;letter-spacing:.085em;
  text-transform:uppercase;color:var(--ink-text);margin-top:4px;
  text-decoration:underline;text-underline-offset:2px}
.pbar{width:96px;height:2px;background:var(--hairline);margin-top:6px;position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--acid)}

/* storage banner row (spec §5.6) */
.pbanner{height:44px;display:flex;align-items:center;border-top:1px solid var(--hairline);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.085em;text-transform:uppercase;
  color:var(--ink-text)}

/* ---- host home backdrop (identical anatomy to home/solo mockup) ---- */
.h-zone{position:absolute;top:44px;left:0;right:0;bottom:152px;padding:24px var(--margin) 0}
.h-sec{display:flex;align-items:center;height:32px}
.h-sec .lab{font-family:var(--mono);font-size:11px;letter-spacing:.085em;
  text-transform:uppercase;color:var(--mono-gray);display:flex;align-items:center;gap:8px}
.h-sec .filters{margin-left:auto;display:flex;gap:8px}
.h-chip{height:32px;padding:0 12px;display:flex;align-items:center;border:1px solid var(--outline);
  border-radius:var(--r-pill);font-family:var(--mono);font-size:10.5px;letter-spacing:.085em;
  text-transform:uppercase;color:var(--mono-gray)}
.h-chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.h-cell{position:relative;padding:12px 104px 12px 0;border-top:1px solid var(--hairline)}
.h-cell .ts{position:absolute;top:12px;right:0;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.085em;color:var(--mono-gray)}
.h-trav{font-family:var(--body);font-size:15px;line-height:1.35;color:var(--ink-text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-part{margin-top:4px;font-family:var(--display);font-weight:800;font-size:17px;line-height:1.25;
  color:var(--ink-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-part.cjk{font-family:var(--cjk);font-weight:700}
.h-keep{display:inline-block;vertical-align:0px;margin-right:8px;padding:2px 8px;background:var(--ink);
  border-radius:var(--r-chip);font-family:var(--mono);font-size:9.5px;letter-spacing:.085em;
  text-transform:uppercase;color:var(--paper)}
.h-f2f{position:absolute;left:var(--margin);right:var(--margin);bottom:96px;height:44px;
border:1px solid var(--outline);border-radius:var(--r-pill);display:flex;align-items:center;
  justify-content:center;gap:10px;font-family:var(--mono);font-size:11px;
  letter-spacing:.085em;text-transform:uppercase;color:var(--ink-text);background:var(--canvas)}
.h-dock{position:absolute;left:0;right:0;bottom:0;height:84px}
.h-orb{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:var(--r-circle);
  transform:translate(-50%,-50%);background:var(--acid);display:flex;align-items:center;
  justify-content:center;color:var(--on-acid)}
.h-orb svg{width:24px;height:24px}
.h-util{position:absolute;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;
  display:flex;align-items:center;justify-content:center;color:var(--ink-text)}
.h-util .tg{font-family:var(--body);font-size:24px;line-height:1}
.h-util svg{width:24px;height:24px}
.h-util.t{left:calc(50% - 64px)}
.h-util.c{left:calc(50% + 64px)}

/* ---- confirm card (spec §4.1): half-sheet over the pack sheet ---- */
.pcard{position:absolute;left:0;right:0;bottom:0;z-index:16;background:var(--paper);
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;box-shadow:0 -8px 32px rgba(11,11,11,.18);
  padding:12px var(--margin) 24px}
.pcard .grab{width:36px;height:4px;border-radius:var(--r-pill);background:rgba(11,11,11,.2);margin:0 auto 16px}
.pcard .t{font-family:var(--mono);font-size:11px;letter-spacing:.085em;text-transform:uppercase;
  color:var(--ink-text)}
.pcard .b{margin-top:12px;font-family:var(--body);font-size:15px;line-height:1.35;color:var(--ink-text)}
.pcard .actions{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.pcard .btn{height:48px;border-radius:var(--r-ctl);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;letter-spacing:.085em;text-transform:uppercase}
.pcard .btn.pri{background:var(--acid);color:var(--on-acid)}
.pcard .btn.sec{border:1px solid var(--ink-text);color:var(--ink-text)}

/* ---- row action sheet (delete, spec §5.7) ---- */
.pdel{position:absolute;left:0;right:0;bottom:0;z-index:16;background:var(--paper);
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;box-shadow:0 -8px 32px rgba(11,11,11,.18);
  padding:12px var(--margin) 24px}
.pdel .grab{width:36px;height:4px;border-radius:var(--r-pill);background:rgba(11,11,11,.2);margin:0 auto 16px}
.pdel .t{font-family:var(--mono);font-size:11px;letter-spacing:.085em;text-transform:uppercase;
  color:var(--ink-text);margin-bottom:20px}
.pdel .actions{display:flex;flex-direction:column;gap:12px}
.pdel .btn{height:48px;border-radius:var(--r-ctl);display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;letter-spacing:.085em;text-transform:uppercase}
.pdel .btn.pri{background:var(--ink);color:var(--paper)}
.pdel .btn.sec{border:1px solid var(--ink-text);color:var(--ink-text)}

/* update chip riding on a READY row (spec §5.8) */
.upd{margin-top:8px;display:inline-flex;height:24px;padding:0 12px;align-items:center;
  border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:var(--r-pill);
  font-family:var(--mono);font-size:9.5px;
  letter-spacing:.085em;text-transform:uppercase}

/* in-sheet scrim for confirm card / action sheet (dims the pack sheet, never the header) */
.pscrim{position:absolute;inset:0;background:rgba(11,11,11,.32);z-index:14}
.pcard .btn.dis{color:var(--mono-gray);opacity:.55}

/* failure caption (spec §4.6): mono, under its row, content+position only */
.failcap{margin:-8px 0 12px;font-family:var(--mono);font-size:9.5px;letter-spacing:.085em;
  text-transform:uppercase;color:var(--mono-gray)}
</style>
</head>
<body>
<div id="switcher"></div>
<div id="stage">
  <div id="phone">
    <!-- states injected -->
  </div>
</div>
<script>
/* Neurora — pack management + offline states mockup, hifi-packs-offline v1 (rev 4) */
const I={
 swap:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h12m0 0-3-3m3 3-3 3M20 16H8m0 0 3-3m-3 3 3 3"/></svg>',
 mic:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
 spk:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/></svg>',
 cam:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><circle cx="12" cy="12" r="3.2"/></svg>',
};

/* ---- host surface (identical construction to home/solo mockup) ---- */
function header(c={}){return `
  <header class="p-head">
    <span class="swap">${I.swap}</span>
    <span class="pairwrap"><div class="pair"><span class="flag">🇬🇧</span>EN<span class="sep">⇄</span>JA<span class="flag">🇯🇵</span></div>${c.sub?`<div class="sub">${c.sub}</div>`:''}</span>
    <span class="pill">OFFLINE</span>
  </header>`;}

function cell(c){return `<article class="h-cell">
  <span class="ts">${c.keep?'<span class="h-keep">KEEP</span>':''}${c.ts}</span>
  <div class="h-trav">${c.trav}</div>
  ${c.part?`<div class="h-part ${c.cjk?'cjk':''}">${c.part}</div>`:''}
</article>`;}

const HOST_HOME = `
  <main class="h-zone">
    <div class="h-sec"><span class="lab">Recent</span><span class="filters"><span class="h-chip">Saved</span></span></div>
    ${cell({ts:'19:04',trav:'Excuse me, which platform does the limited express to Osaka leave from?',
            part:'すみません、大阪行きの特急は何番線から出ますか？',cjk:true,trail:true})}
    ${cell({ts:'19:02',trav:'It’s on platform 4, car 8 is unreserved.',part:'4番線です。8号車は自由席です。',
            cjk:true,trail:true,keep:true})}
    ${cell({ts:'18:51',trav:'Menu: grilled eel set — ¥2,400',part:'うなぎの蒲焼き定食 — 2,400円',cjk:true,trail:true})}
  </main>
  <div class="h-f2f">${I.mic} FACE TO FACE</div>
  <div class="h-dock">
    <span class="h-util t"><span class="tg">T</span></span>
    <span class="h-orb">${I.mic}</span>
    <span class="h-util c">${I.cam}</span>
  </div>`;

/* ---- pack sheet builders ---- */
function prow(c){return `
  <div class="prow ${c.cls||''}">
    <div class="l">
      <div class="native ${c.cjk?'cjk':''}">${c.native}</div>
      <div class="cap">${c.flag?`<span class="flag">${c.flag}</span> `:``}${c.cap}</div>
    </div>
    <div class="r">${c.r}</div>
  </div>${c.fail?`<div class="failcap">${c.fail}</div>`:''}`;}

const ready = mb => `<span class="m"><i class="rdot"></i>READY · ${mb} MB</span>`;
const getb  = mb => `<span class="getbtn">GET · ${mb} MB</span>`;
const queued = () => `<span class="m">QUEUED — WI-FI</span><span class="getnow">GET NOW</span>`;
const downloading = (pct, got, mb) =>
  `<span class="m">${pct}% · ${got}/${mb} MB</span><span class="pbar"><i style="width:${pct}%"></i></span>`;

function psheet(c){return `
  <div class="scrim"></div>
  <section class="psheet">
    <div class="ps-grabzone"><div class="ps-grabber"></div></div>
    <div class="ps-head">
      <span class="ps-title">${c.title||'LANGUAGE PACKS'}</span>
      <span class="ps-done">DONE</span>
    </div>
    <div class="ps-agg">${c.agg.includes('READY')?'<i class="rdot"></i>':''}${c.agg}</div>
    <div class="ps-list">${c.banner?`<div class="pbanner">${c.banner}</div>`:''}${c.rows}</div>
  </section>
  ${c.overlay||''}`;}

/* ---- pack catalog (traveler locale = English; sort A→Z among downloadables) ---- */
const FLAGS={JA:'🇯🇵',KO:'🇰🇷',AR:'🇸🇦',ZH:'🇨🇳',FR:'🇫🇷',DE:'🇩🇪',HI:'🇮🇳',IT:'🇮🇹',PT:'🇵🇹',RU:'🇷🇺',ES:'🇪🇸',TH:'🇹🇭'};
const PACKS={
 JA:{native:'日本語',cap:'JAPANESE',mb:210,cjk:true},
 KO:{native:'한국어',cap:'KOREAN',mb:96,cjk:true},
 AR:{native:'العربية',cap:'ARABIC',mb:232},
 ZH:{native:'中文（简体）',cap:'CHINESE (SIMPLIFIED)',mb:240,cjk:true},
 FR:{native:'Français',cap:'FRENCH',mb:210},
 DE:{native:'Deutsch',cap:'GERMAN',mb:184},
 HI:{native:'हिन्दी',cap:'HINDI',mb:204},
 IT:{native:'Italiano',cap:'ITALIAN',mb:178},
 PT:{native:'Português',cap:'PORTUGUESE',mb:172},
 RU:{native:'Русский',cap:'RUSSIAN',mb:220},
 ES:{native:'Español',cap:'SPANISH',mb:196},
 TH:{native:'ไทย',cap:'THAI',mb:168},
};
const AZ=['AR','ZH','FR','DE','HI','IT','PT','RU','ES','TH'];
function P(k,variant,opts={}){
  const p=PACKS[k]; const o={native:p.native,cap:p.cap,cjk:p.cjk,flag:FLAGS[k],...opts};
  if(variant==='ready') o.r=ready(opts.installed||p.mb);
  if(variant==='update') o.r=ready(opts.installed||p.mb)+`<span class="upd">UPDATE · ${opts.upd} MB</span>`;
  if(variant==='get') o.r=getb(p.mb);
  if(variant==='queued') o.r=`<span class="m">QUEUED — WI-FI · ${p.mb} MB</span><span class="getnow">GET NOW</span>`;
  if(variant==='down') o.r=downloading(opts.pct,opts.got,p.mb);
  if(variant==='paused-user') o.r=`<span class="m">PAUSED · ${opts.got}/${p.mb} MB</span><span class="getnow">TAP TO RESUME</span>`;
  if(variant==='paused-net') o.r=`<span class="m">PAUSED — RESUMES ON WI-FI · ${opts.got}/${p.mb} MB</span>`;
  if(variant==='err-storage') o.r=`<span class="m">STORAGE FULL — NEED ${p.mb} MB</span>`;
  return prow(o);
}
/* ready group then downloadable A→Z (spec §3), attention rows pinned above */
const READY_2 = P('JA','ready',{installed:84})+P('KO','update',{installed:96,upd:12});
const AZ_ROWS = AZ.map(k=>P(k,'get')).join('');
const CONFIRM_CARD=(btn1,btn2dis)=>`
     <div class="pscrim"></div>
     <div class="pcard">
       <div class="grab"></div>
       <div class="t"><span class="flag">🇫🇷</span> FRENCH PACK — 210 MB · ~40 S ON WI-FI</div>
       <div class="b">Voice + text, both directions.</div>
       <div class="actions">
         <span class="btn pri">${btn1}</span>
         <span class="btn sec${btn2dis?' dis':''}">DOWNLOAD NOW — USES MOBILE DATA</span>
       </div>
     </div>`;

/* ---- states ---- */
const STATES={
 'resting':{
   header:{},
   sheet:{agg:'2 PACKS READY · EVERYTHING WORKS OFFLINE', rows:READY_2+AZ_ROWS}
 },
 'downloading':{
   header:{sub:'JA PACK · 62%'},
   sheet:{agg:'1 PACK READY · 3 AVAILABLE', rows:
     P('JA','down',{pct:62,got:130})
    +P('KO','queued')
    +P('IT','ready')
    +['AR','ZH','FR','DE','HI','PT','RU','ES','TH'].map(k=>P(k,'get')).join('')}
 },
 'paused':{
   sheet:{agg:'1 PACK READY · 3 AVAILABLE', rows:
     P('JA','paused-user',{got:130})
    +P('KO','paused-net',{got:41})
    +P('IT','ready')
    +P('AR','get')+P('ZH','get')
    +P('FR','get',{fail:'SERVER UNREACHABLE — TRY AGAIN LATER'})
    +['DE','HI','PT','RU','ES','TH'].map(k=>P(k,'get')).join('')}
 },
 'confirm':{
   header:{},
   sheet:{agg:'2 PACKS READY · EVERYTHING WORKS OFFLINE', overlay:CONFIRM_CARD('DOWNLOAD ON WI-FI',false),
     rows:READY_2+AZ_ROWS}
 },
 'confirm-queue':{
   header:{},
   sheet:{agg:'2 PACKS READY · EVERYTHING WORKS OFFLINE', overlay:CONFIRM_CARD('QUEUE FOR WI-FI',true),
     rows:READY_2+AZ_ROWS}
 },
 'storage':{
   header:{},
   sheet:{agg:'2 PACKS READY · EVERYTHING WORKS OFFLINE',
     banner:'STORAGE FULL — FREE 210 MB TO CONTINUE', rows:
     P('FR','err-storage')
    +READY_2
    +['AR','ZH','DE','HI','IT','PT','RU','ES','TH'].map(k=>P(k,'get')).join('')}
 },
 'delete':{
   header:{},
   sheet:{agg:'2 PACKS READY · EVERYTHING WORKS OFFLINE', overlay:`
     <div class="pscrim"></div>
     <div class="pdel">
       <div class="grab"></div>
       <div class="t"><span class="flag">🇯🇵</span> JAPANESE PACK</div>
       <div class="actions">
         <span class="btn pri">DELETE PACK · FREES 84 MB</span>
         <span class="btn sec">KEEP</span>
       </div>
     </div>`, rows:READY_2+AZ_ROWS}
 },
 'first-run':{
   header:{},
   sheet:{agg:'NOTHING DOWNLOADED YET — PICK A LANGUAGE', rows:
     prow({native:PACKS.JA.native,cap:'SUGGESTED FOR THIS PHONE',flag:FLAGS.JA,cjk:true,r:getb(PACKS.JA.mb)})
    +AZ_ROWS}
 }
};

/* ---- assemble + switcher (runner chrome, not part of the design) ---- */
const phone=document.getElementById('phone');
for (const [name,s] of Object.entries(STATES)){
  const el=document.createElement('div');
  el.className='state'; el.dataset.state=name;
  el.innerHTML=header(s.header||{})+HOST_HOME+psheet(s.sheet);
  phone.appendChild(el);
}
const sw=document.getElementById('switcher');
for (const name of Object.keys(STATES)){
  const b=document.createElement('button');
  b.textContent=name; b.dataset.state=name;
  b.onclick=()=>show(name);
  sw.appendChild(b);
}
function show(name){
  if(!STATES[name]) name=Object.keys(STATES)[0];
  document.querySelectorAll('.state').forEach(el=>el.classList.toggle('active', el.dataset.state===name));
  document.querySelectorAll('#switcher button').forEach(b=>b.classList.toggle('active', b.dataset.state===name));
  history.replaceState(null,'','#'+name);
}
show(location.hash.slice(1));
</script>
</body>
